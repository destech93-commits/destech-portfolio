<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESTECH | Admin Control</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        body { background: #050505; color: #fff; font-family: 'Inter', sans-serif; }
        .admin-glass { 
            background: rgba(255, 255, 255, 0.02); 
            border: 1px solid rgba(0, 212, 255, 0.2); 
            backdrop-filter: blur(20px); 
            border-radius: 20px;
        }
        .status-pulse {
            width: 10px; height: 10px; background: #00d4ff;
            border-radius: 50%; box-shadow: 0 0 10px #00d4ff;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.5; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- Header / Status -->
    <header class="flex justify-between items-center mb-10">
        <div>
            <h1 class="text-2xl font-black tracking-tighter text-cyan-400 uppercase">Destech Admin</h1>
            <p class="text-xs text-gray-500 uppercase tracking-widest">System Operational</p>
        </div>
        <div class="flex items-center gap-2 admin-glass px-4 py-2">
            <div class="status-pulse"></div>
            <span class="text-[10px] font-bold uppercase">Live</span>
        </div>
    </header>

    <!-- Stats Grid -->
    <div class="grid grid-cols-2 gap-4 mb-8">
        <div class="admin-glass p-6 text-center">
            <p class="text-gray-500 text-[10px] uppercase mb-1">Total Orders</p>
            <p class="text-3xl font-black">24</p>
        </div>
        <div class="admin-glass p-6 text-center border-purple-500/30">
            <p class="text-gray-500 text-[10px] uppercase mb-1">Revenue</p>
            <p class="text-3xl font-black text-purple-400">₦1.2M</p>
        </div>
    </div>

    <!-- Active Orders Feed -->
    <section>
        <h2 class="text-xs font-bold text-gray-400 uppercase tracking-[0.3em] mb-6">Pending Verifications</h2>
        
        <!-- Order Item 1 -->
        <div class="admin-glass p-5 mb-4 flex justify-between items-center">
            <div>
                <p class="font-bold text-sm">Website Design Order</p>
                <p class="text-[10px] text-cyan-400">Buyer: @user123 • ₦150,000</p>
            </div>
            <button class="bg-cyan-600 hover:bg-cyan-500 text-[10px] font-black px-4 py-2 rounded-lg transition uppercase">Review Receipt</button>
        </div>

        <!-- Order Item 2 -->
        <div class="admin-glass p-5 mb-4 flex justify-between items-center border-purple-500/20">
            <div>
                <p class="font-bold text-sm">Graphics Pack</p>
                <p class="text-[10px] text-purple-400">Buyer: @brand_pro • ₦50,000</p>
            </div>
            <button class="bg-purple-600 hover:bg-purple-500 text-[10px] font-black px-4 py-2 rounded-lg transition uppercase">Review Receipt</button>
        </div>
    </section>

    <!-- Quick Actions Bottom Bar -->
    <nav class="fixed bottom-6 left-4 right-4 flex justify-around p-4 admin-glass border-white/5">
        <button class="text-cyan-400"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg></button>
        <button class="text-gray-500"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg></button>
        <button class="text-gray-500"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg></button>
    </nav>

</body>
</html>
