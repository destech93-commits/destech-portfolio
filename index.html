<!-- Replace your current #services section with this improved version -->
<section id="services" class="py-20 px-8 max-w-7xl mx-auto">
    <div class="text-center mb-16">
        <h2 class="text-5xl font-black mb-4">Our Expertise</h2>
        <p class="text-gray-400">Search through 1,000+ specialized digital skills</p>
        
        <!-- Animated Search Bar -->
        <div class="mt-8 max-w-xl mx-auto relative">
            <input type="text" id="skillSearch" placeholder="Search for a skill (e.g. Python, Logos, Apps)..." 
                   class="w-full p-4 bg-white/5 border border-white/10 rounded-full focus:border-pink-500 outline-none transition-all">
        </div>
    </div>

    <!-- Category Filters -->
    <div class="flex flex-wrap justify-center gap-4 mb-12" id="filter-btns">
        <button class="px-6 py-2 glass rounded-full hover:bg-pink-600 transition text-sm">Graphics Design</button>
        <button class="px-6 py-2 glass rounded-full hover:bg-pink-600 transition text-sm font-bold border-pink-500 border">Author & Publishing</button>
        <button class="px-6 py-2 glass rounded-full hover:bg-pink-600 transition text-sm">Cybersecurity</button>
        <button class="px-6 py-2 glass rounded-full hover:bg-pink-600 transition text-sm">App Dev</button>
        <button class="px-6 py-2 glass rounded-full hover:bg-pink-600 transition text-sm">Business Systems</button>
    </div>

    <!-- The 10-Category Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="categoryGrid">
        <!-- Hero Category: Author & Publishing -->
        <div class="glass p-8 group hover:border-pink-500 transition-all duration-500 relative overflow-hidden">
            <div class="absolute -right-4 -top-4 w-24 h-24 bg-pink-600/20 rounded-full blur-3xl group-hover:bg-pink-600/40 transition"></div>
            <h3 class="text-2xl font-bold mb-2">Author & Publishing</h3>
            <p class="text-gray-400 mb-6">Premium website designs for writers. Turn your brand into a bestseller.</p>
            <div class="flex justify-between items-center">
                <span class="text-sm font-mono text-pink-500">STARTING ₦150,000</span>
                <button class="px-4 py-2 border border-white/20 rounded-lg group-hover:bg-white group-hover:text-black transition">View Gigs</button>
            </div>
        </div>

        <!-- Add other categories similarly here -->
        <div class="glass p-8 group hover:border-purple-500 transition-all">
            <h3 class="text-2xl font-bold mb-2">Cybersecurity</h3>
            <p class="text-gray-400 mb-6">Threat protection and enterprise-grade tech support.</p>
            <div class="flex justify-between items-center">
                <span class="text-sm font-mono text-purple-500">STARTING ₦50,000</span>
                <button class="px-4 py-2 border border-white/20 rounded-lg group-hover:bg-white group-hover:text-black transition">View Gigs</button>
            </div>
        </div>
    </div>
</section>
