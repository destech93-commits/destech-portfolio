<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESTECH | Future-Proof Digital Solutions</title>
    <script src="https://tailwindcss.com"></script>
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://gstatic.com";

        // Your Unique Destech Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDL2EJe0JY9x4INdXfhw3NG8haufwgGG14",
            authDomain: "destech-2b0ba.firebaseapp.com",
            projectId: "destech-2b0ba",
            storageBucket: "destech-2b0ba.firebasestorage.app",
            messagingSenderId: "593019215109",
            appId: "1:593019215109:web:00e5bc2fbfbb0431c1ab6c"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Authentication Logic
        window.handleAuth = async (mode) => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            if(!email || !pass) return alert("Please fill all fields");
            
            try {
                if (mode === 'signup') {
                    await createUserWithEmailAndPassword(auth, email, pass);
                    alert("Welcome to Destech! Account created.");
                } else {
                    await signInWithEmailAndPassword(auth, email, pass);
                }
                toggleModal(false);
            } catch (error) {
                alert(error.message);
            }
        };

        window.logout = () => signOut(auth);

        // Update UI based on User Login Status
        onAuthStateChanged(auth, (user) => {
            const authBtn = document.getElementById('auth-nav-btn');
            const protectedSection = document.getElementById('protected-content');
            const guestMsg = document.getElementById('guest-msg');
            
            if (user) {
                authBtn.innerText = "Logout";
                authBtn.onclick = logout;
                protectedSection.classList.remove('hidden');
                guestMsg.classList.add('hidden');
            } else {
                authBtn.innerText = "Login / Sign Up";
                authBtn.onclick = () => toggleModal(true);
                protectedSection.classList.add('hidden');
                guestMsg.classList.remove('hidden');
            }
        });
    </script>

    <style>
        :root { --pink: #A91079; --purple: #2E0249; }
        body { background: #0D0D0D; color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; }
        .pink-glow { text-shadow: 0 0 15px rgba(169, 16, 121, 0.8); }
        .mesh-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(circle at 10% 20%, rgba(46, 2, 73, 0.6), transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(169, 16, 121, 0.3), transparent 40%);
        }
    </style>
</head>
<body>
    <div class="mesh-bg"></div>

    <!-- Navigation -->
    <nav class="flex justify-between items-center p-6 fixed w-full top-0 z-50 glass">
        <div class="text-2xl font-bold pink-glow tracking-tighter">DESTECH</div>
        <button id="auth-nav-btn" class="px-6 py-2 border border-pink-500 rounded-full hover:bg-pink-600 transition duration-300">Login</button>
    </nav>

    <!-- Hero Section -->
    <section class="h-[60vh] flex flex-col items-center justify-center text-center px-4 pt-20">
        <h1 class="text-6xl md:text-8xl font-black mb-4">DESTECH</h1>
        <p class="text-gray-400 tracking-[0.4em] uppercase text-xs md:text-sm">Future-Proof Digital Solutions</p>
        <div id="guest-msg" class="mt-10 text-pink-400 animate-pulse">Login to unlock the Marketplace</div>
    </section>

    <!-- Authentication Modal -->
    <div id="auth-modal" class="fixed inset-0 bg-black/90 z-[100] hidden flex items-center justify-center p-4">
        <div class="glass p-8 w-full max-w-md border-pink-500/30 border">
            <h2 class="text-2xl font-bold mb-6 text-center">Enter the System</h2>
            <input type="email" id="email" placeholder="Your Email" class="w-full p-4 bg-white/5 border border-white/10 rounded-xl mb-4 outline-none focus:border-pink-500 transition">
            <input type="password" id="pass" placeholder="Your Password" class="w-full p-4 bg-white/5 border border-white/10 rounded-xl mb-6 outline-none focus:border-pink-500 transition">
            <div class="flex gap-4">
                <button onclick="handleAuth('login')" class="flex-1 py-4 bg-white text-black font-bold rounded-xl hover:bg-gray-200 transition">Login</button>
                <button onclick="handleAuth('signup')" class="flex-1 py-4 border border-pink-500 rounded-xl hover:bg-pink-600 transition">Sign Up</button>
            </div>
            <button onclick="toggleModal(false)" class="w-full mt-6 text-gray-500 text-sm hover:text-white">Close</button>
        </div>
    </div>

    <!-- Protected Content (Marketplace) -->
    <section id="protected-content" class="hidden py-20 px-8 max-w-7xl mx-auto">
        <div class="flex justify-between items-center mb-12">
            <h2 class="text-4xl font-bold">Marketplace</h2>
            <a href="https://instagram.com" class="text-pink-500 text-sm font-bold border-b border-pink-500 pb-1">Message on Instagram</a>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="glass p-8 border-l-4 border-pink-600 hover:scale-[1.02] transition-transform">
                <h3 class="text-xl font-bold mb-2">Author & Publishing</h3>
                <p class="text-gray-400 text-sm mb-6">Pro website design for authors.</p>
                <div class="flex justify-between items-center">
                    <span class="text-xs font-mono text-pink-500">FROM ₦150,000</span>
                    <button class="px-4 py-2 bg-pink-600 rounded-lg text-sm font-bold">Start Order</button>
                </div>
            </div>

            <div class="glass p-8 border-l-4 border-purple-600 hover:scale-[1.02] transition-transform">
                <h3 class="text-xl font-bold mb-2">Cybersecurity Audit</h3>
                <p class="text-gray-400 text-sm mb-6">Threat protection for your business.</p>
                <div class="flex justify-between items-center">
                    <span class="text-xs font-mono text-purple-500">FROM ₦50,000</span>
                    <button class="px-4 py-2 bg-purple-600 rounded-lg text-sm font-bold">Secure Now</button>
                </div>
            </div>
        </div>
    </section>

    <script>
        function toggleModal(show) {
            document.getElementById('auth-modal').classList.toggle('hidden', !show);
        }
    </script>
</body>
</html>
